<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuckVision — Games</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .filter-row { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; align-items: flex-end; }
    .filter-row .field { min-width: 150px; }

    .stage-group { margin-bottom: 36px; }
    .stage-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .stage-header h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--accent); margin: 0;
    }
    .stage-count {
      font-size: 0.65rem; letter-spacing: 1px;
      color: var(--muted); background: rgba(255,255,255,0.05);
      padding: 3px 8px; border-radius: 20px;
    }

    .game-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 24px; margin-bottom: 10px;
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 20px;
      transition: border-color 0.2s, transform 0.15s;
    }
    .game-card:hover { border-color: rgba(0,194,255,0.3); transform: translateY(-1px); }
    .game-card.status-live { border-color: rgba(255,196,0,0.3); }

    .team-side { display: flex; flex-direction: column; gap: 3px; }
    .team-side.away { align-items: flex-end; text-align: right; }

    .team-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem; font-weight: 800; letter-spacing: 3px;
      color: #fff;
    }
    .team-name { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.5px; }
    .winner .team-code { color: var(--accent); }

    .game-center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .score-box {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.6rem; font-weight: 800;
      letter-spacing: 6px; color: #fff; line-height: 1;
    }
    .score-sep { color: var(--muted); margin: 0 2px; font-weight: 300; }
    .score-box.scheduled { font-size: 1rem; letter-spacing: 2px; color: var(--muted); font-weight: 400; }

    .status-badge {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; padding: 3px 10px;
      border-radius: 20px;
    }
    .badge-final    { background: rgba(0,200,100,0.12); color: #00c864; border: 1px solid rgba(0,200,100,0.25); }
    .badge-live     { background: rgba(255,196,0,0.12);  color: var(--gold); border: 1px solid rgba(255,196,0,0.3); animation: pulse 1.5s infinite; }
    .badge-scheduled{ background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border); }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    .game-meta { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.5px; }

    .gender-section { margin-bottom: 48px; }
    .gender-header {
      font-family: 'Barlow Condensed', sans-serif; font-size: 1.5rem;
      font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
      color: #fff; margin-bottom: 20px; padding-bottom: 12px;
      border-bottom: 2px solid var(--accent);
    }
    .empty { text-align: center; padding: 60px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><p class="eyebrow">Beijing 2022</p><h1>PuckVision</h1></div>
    <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
    <a href="compare.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M8 21H3v-5M21 3l-7 7M3 21l7-7"/></svg>Compare Players</a>
    <a href="leaderboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Leaderboard</a>
    <a href="teams.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Teams</a>
    <a href="results.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Games</a>
    <a href="player.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Player Profile</a>
    <div class="nav-bottom"><div class="nav-user" id="nav-user-email"></div><button class="btn-logout" onclick="logout()">Sign Out</button></div>
  </nav>

  <main class="main">
    <div class="page-header fade-up">
      <p class="eyebrow">Schedule</p>
      <h2>Games</h2>
      <p>Full schedule & scores from the Beijing 2022 tournament</p>
    </div>

    <div class="filter-row fade-up-2">
      <div class="field">
        <label class="field-label">Stage</label>
        <select id="filter-stage" onchange="render()"><option value="">All Stages</option></select>
      </div>
      <div class="field">
        <label class="field-label">Team</label>
        <select id="filter-team" onchange="render()"><option value="">All Teams</option></select>
      </div>
      <div class="field">
        <label class="field-label">Gender</label>
        <select id="filter-sex" onchange="render()">
          <option value="">All</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
        </select>
      </div>
    </div>

    <div id="results-list" class="fade-up-3">
      <div class="loading">Loading games...</div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    let allResults = [];

    requireAuth().then(async () => {
      try {
        const res = await fetch('/results');
        allResults = await res.json();

        // Populate filter dropdowns
        const stages = [...new Set(allResults.map(r => r.eventStage).filter(Boolean))].sort();
        const stageSel = document.getElementById('filter-stage');
        stages.forEach(s => stageSel.innerHTML += `<option value="${s}">${s}</option>`);

        const teams = [...new Set([
          ...allResults.map(r => r.teamH),
          ...allResults.map(r => r.teamA)
        ].filter(Boolean))].sort();
        const teamSel = document.getElementById('filter-team');
        teams.forEach(t => teamSel.innerHTML += `<option value="${t}">${t}</option>`);

        render();
      } catch(e) {
        document.getElementById('results-list').innerHTML = `<div class="error">Failed to load games: ${e.message}</div>`;
      }
    });

    function render() {
      const stage = document.getElementById('filter-stage').value;
      const team  = document.getElementById('filter-team').value;
      const sex   = document.getElementById('filter-sex').value;

      const filtered = allResults.filter(r =>
        (!stage || r.eventStage === stage) &&
        (!team  || r.teamH === team || r.teamA === team) &&
        (!sex   || r.sex === sex)
      );

      if (filtered.length === 0) {
        document.getElementById('results-list').innerHTML = '<div class="empty">No games found for selected filters.</div>';
        return;
      }

      // Group by gender then stage, Women first, stages alphabetical within each gender
      const genderOrder = ['Women', 'Men'];
      const byGender = {};
      filtered.forEach(r => {
        const gender = r.sex || 'Other';
        const stage  = r.eventStage || 'Other';
        if (!byGender[gender]) byGender[gender] = {};
        if (!byGender[gender][stage]) byGender[gender][stage] = [];
        byGender[gender][stage].push(r);
      });

      const genders = genderOrder.filter(g => byGender[g]);
      document.getElementById('results-list').innerHTML = genders.map(gender => {
        const goldKey = `${gender}'s Gold Medal Game`;
        const stages = Object.keys(byGender[gender]).sort((a, b) => {
          if (a === goldKey) return -1;
          if (b === goldKey) return  1;
          return a.localeCompare(b);
        });
        return `
          <div class="gender-section">
            <div class="gender-header">${gender}</div>
            ${stages.map(stageName => {
              const games = byGender[gender][stageName];
              return `
                <div class="stage-group">
                  <div class="stage-header">
                    <h3>${stageName}</h3>
                    <span class="stage-count">${games.length} game${games.length !== 1 ? 's' : ''}</span>
                  </div>
                  ${games.map(r => renderCard(r)).join('')}
                </div>`;
            }).join('')}
          </div>`;
      }).join('');
    }

    function renderCard(r) {
      const isFinal     = r.eventStatus === 'Finished';
      const isLive      = r.eventStatus === 'Live';
      const isScheduled = !isFinal && !isLive;

      const homeWin = isFinal && r.scoreTH > r.scoreTA;
      const awayWin = isFinal && r.scoreTA > r.scoreTH;

      const date = r.time
        ? new Date(r.time).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : '';
      const time = r.time
        ? new Date(r.time).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
        : '';

      const badgeClass = isFinal ? 'badge-final' : isLive ? 'badge-live' : 'badge-scheduled';
      const badgeLabel = isFinal ? 'Finished' : isLive ? '● Live' : time || 'Scheduled';

      const scoreDisplay = isScheduled
        ? `<div class="score-box scheduled">${time || 'TBD'}</div>`
        : `<div class="score-box">
             <span class="${homeWin ? 'winner' : ''}">${r.scoreTH ?? '—'}</span>
             <span class="score-sep">–</span>
             <span class="${awayWin ? 'winner' : ''}">${r.scoreTA ?? '—'}</span>
           </div>`;

      return `
        <div class="game-card ${isLive ? 'status-live' : ''}">
          <div class="team-side ${homeWin ? 'winner' : ''}">
            <div class="team-code">${r.teamHCode || r.teamH}</div>
            <div class="team-name">${r.teamH}</div>
          </div>
          <div class="game-center">
            ${scoreDisplay}
            <span class="status-badge ${badgeClass}">${badgeLabel}</span>
            <div class="game-meta">${date}${r.location ? ' · ' + r.location : ''}</div>
          </div>
          <div class="team-side away ${awayWin ? 'winner' : ''}">
            <div class="team-code">${r.teamACode || r.teamA}</div>
            <div class="team-name">${r.teamA}</div>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
