<!DOCTYPE html>
<html>
<body>

<h1>Dashboard</h1>

<button onclick="loadDashboard()">Load Dashboard</button>

<p id="result"></p>

<script>
    function loadDashboard() {
        fetch("/dashboard")
            .then(res => res.json())
            .then(data => {
                document.getElementById("result").innerText =
                    "Top Team: " + data.TopTeam +
                    "\nTotal Games: " + data.TotalGamesPlayed +
                    "\nLeader: " + data.CurrentLeader;
            });
    }
    </script>

</body>
</html>
