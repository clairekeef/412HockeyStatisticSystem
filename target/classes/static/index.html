<h1>2022 Olympic Hockey Statistics Dashboard</h1>

<div style="display:flex; gap:60px;">

  <div style="display:flex; flex-direction:column;">
    <label>Player 1 Country</label>
    <select id="filter-country1" onchange="filterPlayers(1)">
      <option value="select">Select Country</option>

  </div>

</div>

<label>Metric</label>
<select id="metric">
  <option value="select">Select Metric</option>
  <option value="G">Goals</option>
  <option value="A">Assists</option>
  <option value="PTS">Points</option>
  <option value="GP">Games Played</option>
  <option value="PIM">Penalty Minutes</option>
  <option value="PPG">Power Play Goals</option>
</select>

<br/><br/>
<button onclick="compare()">Compare Players</button>
<button onclick="loadDashboard()" style="margin-left:10px; background:#444;">Load Dashboard</button>

<p id="result"></p>

<script>
  fetch("/players").then(res => res.json()).then(players => {
    window.playerData = players;

    populateDropdowns(players);

  function populateDropdowns(players) {
    [1, 2].forEach(slot => {
      const sel = document.getElementById("player" + slot);
      sel.innerHTML = "<option value=''>Select Player</option>";
      //sel.innerHTML = "";
      players.forEach(p => {
        sel.innerHTML += `<option value="${p.name}">${p.name}</option>`;
      });
    });
  }

  function filterPlayers(slot) {
    const country = document.getElementById("filter-country" + slot).value;
    const filtered = country
      ? window.playerData.filter(p => p.Country === country)
      : window.playerData;
    const sel = document.getElementById("player" + slot);
    sel.innerHTML = "<option value=''>Select Player</option>";
    //sel.innerHTML = "";
    filtered.forEach(p => {
      sel.innerHTML += `<option value="${p.name}">${p.name}</option>`;
    });
  }

  function compare() {
    const name1 = document.getElementById("player1").value;
    const name2 = document.getElementById("player2").value;
    const metric = document.getElementById("metric").value;
    const p1 = window.playerData.find(p => p.name === name1);
    const p2 = window.playerData.find(p => p.name === name2);
    const winner = p1[metric] > p2[metric] ? p1.name : p2[metric] > p1[metric] ? p2.name : "Tie";
    document.getElementById("result").innerText =
      `${p1.name}: ${p1[metric]}\n${p2.name}: ${p2[metric]}`;
  }

  function loadDashboard() {
    fetch("/dashboard").then(res => res.json()).then(data => {
      document.getElementById("result").innerText =
        "Top Team: " + data.TopTeam +
        "\nTotal Games: " + data.TotalGamesPlayed +
        "\nLeader: " + data.CurrentLeader;
    });
  }
